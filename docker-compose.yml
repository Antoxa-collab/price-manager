version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: price-manager-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - price-manager-network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: price-manager-php
    volumes:
      - ./:/var/www/html
      - ./logs:/var/log/price-manager
    depends_on:
      - mysql
    networks:
      - price-manager-network
    environment:
      DB_HOST: mysql
      DB_DATABASE: price_manager
      DB_USERNAME: price_user
      DB_PASSWORD: price_password

  mysql:
    image: mysql:8.0
    container_name: price-manager-mysql
    ports:
      - "3306:3306"
    vo
    lumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: price_manager
      MYSQL_USER: price_user
      MYSQL_PASSWORD: price_password
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - price-manager-network

networks:
  price-manager-network:
    driver: bridge

volumes:
  mysql_data:
